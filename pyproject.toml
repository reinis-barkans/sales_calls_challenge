[project]
name = "sci"
version = "0.1.0"
description = "Sales Call Intelligence: evidence-grounded Q&A over sales call transcripts"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.6",
  "rank-bm25>=0.2.2",
  "fastembed>=0.4",
  # onnxruntime dropped Intel-Mac wheels after 1.19.2; pin only there.
  "onnxruntime<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy",
  "rapidfuzz>=3.0",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
  "pyyaml>=6",
]

[project.scripts]
sci = "sci.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sci"]

[tool.pytest.ini_options]
pythonpath = ["src"]
