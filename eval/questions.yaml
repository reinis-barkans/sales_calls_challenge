    - "Cites pricing concerns from at least three different companies"
  expect_covered: true

- id: Q06
  category: theme
  question: "Why did customers who left decide to leave?"
  expected_calls: [CALL-014, CALL-015]
  key_facts:
    - "Verity Payments: the connector gap was the stated reason but 'wasn't why we left'; real cause was nobody owned/had capacity to build workflows; moved to Workato"
    - "Oakhill Property: over-bought (4 active users on a 30-user plan at £1,800/month); went back to Zapier"
  expect_covered: true
  expect_conflict: true

- id: Q07
  category: compare
  question: "Has anyone from the vendor given inconsistent answers about the product?"
  expected_calls: [CALL-006, CALL-012]
  key_facts:
    - "Alastair McCrae (CALL-006) said SSO is included on all plans"
    - "Leo Grant (CALL-012) said SAML SSO is Enterprise-only, contradicting Alastair"
    - "Alastair also claimed the prospect's tools were all native connectors (CALL-006)"
  expect_covered: true
  expect_conflict: true

- id: Q08
  category: multi_hop
  question: "Which cold calls produced a follow-up, and what did the successful ones have in common?"
  expected_calls: [CALL-016, CALL-017, CALL-018, CALL-019, CALL-020]
  key_facts:
    - "Beacon Housing Trust (CALL-018) agreed a follow-up meeting"
    - "Silverline Travel (CALL-017) agreed a follow-up (send the page, assistant books it)"
    - "Trafford Dental (CALL-019) ended without a follow-up"
    - "Successful calls showed specific knowledge of the prospect's business and/or honesty about weaknesses"
  expect_covered: true
  notes: "016 = one email in February; 020 = 'send the note' while evaluating Tray. Either is acceptable as a weak follow-up."

