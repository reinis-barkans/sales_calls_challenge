# Gold set. Every label was checked against the transcripts (grep + reading); see `notes`.
# Fields:
#   expected_calls     calls a correct answer must draw on (used for selection recall and cited recall)
#   must_not_cite      calls whose citation indicates a known false match (e.g. a keyword hit in the wrong context)
#   key_facts          facts an LLM judge checks for (present / partial / absent / contradicted)
#   expect_covered     false => the system should decline (transcripts don't contain the answer)
#   expect_conflict    true  => the answer should surface a disagreement

- id: Q01
  category: lookup
  question: "What did Acme Logistics say about their current workflow?"
  expected_calls: [CALL-001]
  key_facts:
    - "Describes Acme's current (largely manual / multi-tool) workflow in their own words, citing CALL-001"
    - "Mentions that Salesforce is part of their stack"
  expect_covered: true

- id: Q02
  category: alias
  question: "What did Acme Corp say about their current workflow?"
  expected_calls: [CALL-001]
  key_facts:
    - "States the assumption that 'Acme Corp' refers to Acme Logistics (no exact match in the data)"
    - "Describes Acme Logistics' current workflow, citing CALL-001"
  expect_covered: true
  notes: "No 'Acme Corp' in the data. Good answers either flag the mapping or decline; silently answering is the failure."

- id: Q03
  category: list
  question: "Which customers mentioned integrations with Salesforce?"
  expected_calls: [CALL-001, CALL-004, CALL-005, CALL-009, CALL-010]
  must_not_cite: [CALL-011]
  key_facts:
    - "Acme Logistics, DeltaWorks, Ember Financial, Inkwell Learning and Juniper Cloud Tools all have Salesforce in their stack/workflow"
    - "Does not present Lumen Retail Group (CALL-011) as a Salesforce integration (theirs was an outage/incident)"
  expect_covered: true
  notes: "grep salesforce: 001 004 005 009 010 011. CALL-011 is an outage. CALL-009 = Salesforce as a data source in the proposed workflow."

- id: Q04
  category: list
  question: "Which competitors were mentioned, and in what context?"
  expected_calls: [CALL-001, CALL-003, CALL-005, CALL-014, CALL-015, CALL-016, CALL-020]
  key_facts:
    - "Zapier (e.g. Oakhill went back to Zapier, CALL-015)"
    - "Workato (Verity moved to Workato, CALL-014)"
    - "Tray.io (Kestrel three weeks into evaluating it, CALL-020)"
    - "Power Automate (e.g. Quarry Ridge already has it, CALL-016)"
    - "Make (Cedar & Finch tested it, CALL-003)"
    - "At least one of MuleSoft (CALL-004), Retool Workflows (CALL-010), Gainsight (CALL-001/009)"
  expect_covered: true
  notes: "zapier 001 003 006 011 015; workato 001 014; tray 005 020; power automate 002 007 008 012 016; mulesoft 004; retool 010; make 003. expected_calls is a core subset."

- id: Q05
